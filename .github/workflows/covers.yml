name: Fetch cover candidates

# Downloads candidate book covers into covers-candidates/ for review (they are not served
# until one is copied into public/covers/). Run manually from the Actions tab.
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/fetch-cover-candidates.ts
      - .github/workflows/covers.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx tsx scripts/fetch-cover-candidates.ts

      - name: Commit candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add covers-candidates
          if git diff --cached --quiet; then
            echo "Nothing new"
          else
            git commit -m "Add cover candidates for review"
            git pull --rebase
            git push
          fi
