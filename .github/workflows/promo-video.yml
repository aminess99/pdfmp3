name: Promo video

# Records and edits the site's promo video (scripts/promo): narration by the site's own voices,
# the site filmed with real OCR and AI, captions and an outro. Commits public/promo/ (the video
# and its thumbnail). Run from the Actions tab, or push a change to .github/promo-video.txt.
on:
  push:
    paths:
      - .github/promo-video.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promo-video
  cancel-in-progress: true

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-noto-ui-core > /dev/null
      - run: npm ci --no-audit --no-fund
      - name: Recording build (demo sign-in enabled)
        run: VITE_DEMO_MODE=1 npm run build
      - run: npm i --no-save playwright@1.63.0 && npx playwright install --with-deps chromium > /dev/null
      - name: Record and edit
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NODE_ENV: production
          PORT: "4789"
        run: |
          node dist/server.cjs > server.log 2>&1 &
          sleep 5
          node scripts/promo/demo-book.cjs promo-out/demo-book.pdf
          npx tsx scripts/promo/narrate.ts promo-out
          node scripts/promo/record.cjs promo-out/demo-book.pdf promo-out
          node scripts/promo/compose.cjs promo-out
          grep -E '^\[(OCR|filter|toc|book-title)\]' server.log | tail -20 || true
      - name: Commit the video
        run: |
          mkdir -p public/promo
          cp promo-out/promo.mp4 public/promo/hakawati-promo.mp4
          cp promo-out/thumbnail.jpg public/promo/hakawati-promo.jpg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/promo
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "Promo video (generated)"
            git pull --rebase
            git push
          fi
